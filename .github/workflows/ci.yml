name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Keep the committed footer year for freshness checks
        run: |
          year=$(python3 -c 'import re; from pathlib import Path; text=Path("site/index.html").read_text(); print(re.search(r"©\s+(\d{4})", text).group(1))')
          echo "CV_BUILD_YEAR=$year" >> "$GITHUB_ENV"
      - run: python3 tools/check.py

  lighthouse:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
